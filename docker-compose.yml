version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      no_cache: true
    restart: always
    ports:
      - "4005:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - DATABASE_URL=${DATABASE_URL}
      - JWT_SECRET=${JWT_SECRET}
      - NEXT_PUBLIC_APP_URL=${NEXT_PUBLIC_APP_URL}
